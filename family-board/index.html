/* Calendar identity: the same warm paper palette as the hub and recipe book, but built as a desk planner
   (index tabs, ring-bound sheet, graph paper) with a slate-blue accent instead of stitched walnut. */
:root{
  --paper:#ebe0cc; --paper-lo:#ddcfb4; --linen:#f6eedd; --card:#fcf7ea; --field:#fffcf3;
  --ink:#3b281d; --ink-soft:#6a5140; --walnut:#6f4a33; --caramel:#b0845b; --rust:#93573a; --line:#d6c3a1; --shadow:rgba(64,41,29,.35);
  --accent:#3d5668; --on-accent:#f6f0e2; --wash:rgba(61,86,104,.10); --wknd:#f2e8d2; --today:#e3ebee;
  --hole:#cdb994; --coil:#7f8c96; --grid:rgba(111,74,51,.075);
  --ok:#4d6a3a; --warn:#8a2f1f; --mark:#b3332a;
  --display:Georgia,'Times New Roman',serif;
  --body:Georgia,'Iowan Old Style','Times New Roman',serif;
  --label:ui-monospace,'Courier New',Courier,monospace;
  color-scheme:light;
}
html[data-theme=dark]{
  --paper:#221913; --paper-lo:#2c2018; --linen:#2f241b; --card:#382b21; --field:#2a1f17;
  --ink:#f1e6d2; --ink-soft:#c9b79e; --walnut:#c79a6b; --caramel:#b0845b; --rust:#e09a74; --line:#57432f; --shadow:rgba(0,0,0,.55);
  --accent:#8db0c6; --on-accent:#16222b; --wash:rgba(141,176,198,.14); --wknd:#32261c; --today:#26343f;
  --hole:#17100b; --coil:#8d9aa4; --grid:rgba(199,154,107,.07);
  --ok:#9bbd7e; --warn:#f0907c; --mark:#ff9a86; color-scheme:dark;
}

/* Style modes (Settings > Appearance). Each one has a light and a dark set; the original warm-paper values above stay as the base. */
html[data-style=neutral]:not([data-theme=dark]){--paper:#eceff1;--paper-lo:#dfe3e6;--linen:#f4f6f7;--card:#ffffff;--field:#fbfcfc;--ink:#1f2a30;--ink-soft:#55646c;--walnut:#455a64;--caramel:#7a8c96;--rust:#2a6a6e;--line:#cfd6da;--shadow:rgba(20,30,40,.25);--accent:#2f6f73;--on-accent:#ffffff;--wash:rgba(47,111,115,.10);--wknd:#f1f3f4;--today:#dcebec;--hole:#c3ccd1;--coil:#90a4ae;--grid:transparent;--ok:#3f7a4a;--warn:#a33a2a;--mark:#c0392b;--display:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
html[data-style=neutral][data-theme=dark]{--paper:#14191c;--paper-lo:#1b2227;--linen:#1e262b;--card:#222b31;--field:#1a2126;--ink:#e8eef1;--ink-soft:#a8b6bd;--walnut:#8fb0bd;--caramel:#6f8793;--rust:#6fc3c7;--line:#36444c;--shadow:rgba(0,0,0,.6);--accent:#6fc3c7;--on-accent:#0c1a1c;--wash:rgba(111,195,199,.14);--wknd:#1d252a;--today:#1f3a3d;--hole:#0e1316;--coil:#8da0a8;--grid:transparent;--ok:#8fcf9a;--warn:#f0907c;--mark:#ff9a86;--display:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
html[data-style=girly]:not([data-theme=dark]){--paper:#f7e6ee;--paper-lo:#efd3e0;--linen:#fbeef3;--card:#fffafc;--field:#ffffff;--ink:#4a2540;--ink-soft:#7d5473;--walnut:#8e3f77;--caramel:#c97fae;--rust:#b02a78;--line:#ecc6da;--shadow:rgba(120,40,90,.3);--accent:#c2468f;--on-accent:#ffffff;--wash:rgba(194,70,143,.10);--wknd:#fbeaf2;--today:#f3e0f5;--hole:#e5b9d0;--coil:#c97fae;--grid:rgba(194,70,143,.07);--ok:#4d7a3a;--warn:#a32a2a;--mark:#c0305e}
html[data-style=girly][data-theme=dark]{--paper:#261522;--paper-lo:#301b2b;--linen:#35202f;--card:#3d2536;--field:#2f1b29;--ink:#fbe8f2;--ink-soft:#d9b3c9;--walnut:#e79bc8;--caramel:#c97fae;--rust:#f08cc0;--line:#5c3750;--shadow:rgba(0,0,0,.55);--accent:#f08cc0;--on-accent:#2a0f20;--wash:rgba(240,140,192,.14);--wknd:#35202f;--today:#3a2540;--hole:#170c14;--coil:#c98fb2;--grid:rgba(240,140,192,.07);--ok:#a8d58b;--warn:#ffa08f;--mark:#ff9fb0}
html[data-style=boyish]:not([data-theme=dark]){--paper:#dde3ea;--paper-lo:#cbd3dd;--linen:#e8edf2;--card:#f7f9fb;--field:#ffffff;--ink:#0f1b2d;--ink-soft:#44546a;--walnut:#1b3a5c;--caramel:#5d7fa3;--rust:#0b5cb8;--line:#b8c3d1;--shadow:rgba(10,25,50,.35);--accent:#14365f;--on-accent:#ffffff;--wash:rgba(11,99,197,.10);--wknd:#e6ebf1;--today:#d3e6f9;--hole:#b3bfcd;--coil:#6f8299;--grid:transparent;--ok:#2a7a3b;--warn:#b3261e;--mark:#d9480f;--display:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
html[data-style=boyish][data-theme=dark]{--paper:#0d1117;--paper-lo:#131a22;--linen:#161e28;--card:#1a232e;--field:#121921;--ink:#e6edf3;--ink-soft:#9fb0c3;--walnut:#79a8e0;--caramel:#5d7fa3;--rust:#4aa3ff;--line:#2c3a4a;--shadow:rgba(0,0,0,.65);--accent:#4aa3ff;--on-accent:#07131f;--wash:rgba(74,163,255,.14);--wknd:#151d27;--today:#14304d;--hole:#080b10;--coil:#6f8299;--grid:transparent;--ok:#6fd08c;--warn:#ff8f84;--mark:#ff9a6b;--display:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

/* Bread mode: the original warm-paper look, with toasted loaf buttons (crust border, crumb dots, two bumps on top). */
html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare){position:relative;isolation:isolate;margin-top:4px;--crust:#7a4318;--toast1:#e6b068;--toast2:#c9843a;--toast3:#a9622a;--bt:#3a1f0d;
  background:radial-gradient(circle at 18% 34%,rgba(255,240,200,.55) 0 1.6px,transparent 2.4px),radial-gradient(circle at 47% 70%,rgba(90,45,15,.28) 0 1.4px,transparent 2.2px),radial-gradient(circle at 78% 30%,rgba(255,240,200,.5) 0 1.6px,transparent 2.4px),radial-gradient(circle at 90% 72%,rgba(90,45,15,.25) 0 1.3px,transparent 2.1px),linear-gradient(var(--toast1),var(--toast2) 62%,var(--toast3));
  color:var(--bt);border:2px solid var(--crust);border-radius:20px 20px 12px 12px;text-shadow:0 1px 0 rgba(255,235,190,.55);
  box-shadow:inset 0 -3px 0 rgba(90,45,15,.3),0 3px 0 var(--crust),0 6px 8px -4px var(--shadow)}
html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare)::before,html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare)::after{content:"";position:absolute;top:-8px;height:8px;width:30%;box-sizing:border-box;z-index:-1;background:var(--toast1);border:2px solid var(--crust);border-bottom:0;border-radius:50% 50% 0 0 / 100% 100% 0 0}
html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare)::before{left:14%}
html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare)::after{right:14%}
html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare).soft{--toast1:#f6e2b4;--toast2:#ecc98a;--toast3:#dfae66;color:#5a3216}
html[data-style=bread][data-breadbtn=on] .btn.soft:not(.quiet):not(.bare):hover{background:radial-gradient(circle at 18% 34%,rgba(255,240,200,.55) 0 1.6px,transparent 2.4px),linear-gradient(#fbeec9,#f0d296 62%,#e4b872)}
html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare).danger{--toast1:#b5562c;--toast2:#933e1c;--toast3:#762f14;--bt:#fff1dc;--crust:#4d1f0a;text-shadow:0 1px 0 rgba(0,0,0,.35)}
html[data-style=bread][data-breadbtn=on] .btn:not(.quiet):not(.bare)[aria-pressed=true],html[data-style=bread][data-breadbtn=on] .btn.soft:not(.quiet):not(.bare)[aria-pressed=true]{--toast1:#c98a3e;--toast2:#a9692a;--toast3:#8a5120;--bt:#fff1dc;text-shadow:0 1px 0 rgba(0,0,0,.3)}
html[data-style=bread][data-breadbtn=on] .btn:hover{filter:brightness(1.06)}
html[data-style=bread][data-breadbtn=on] .btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(90,45,15,.3),0 1px 0 var(--crust)}
html[data-style=bread][data-breadbtn=on] .btn.sm::before,html[data-style=bread][data-breadbtn=on] .btn.sm::after{top:-7px;height:7px}
html[data-style=bread][data-breadbtn=on] .seg .btn,html[data-style=bread][data-breadbtn=on] .seg .btn::before,html[data-style=bread][data-breadbtn=on] .seg .btn::after{border-radius:12px}
@media print{html[data-style=bread][data-breadbtn=on] .btn{display:none}}
html[data-style=neutral] .sheet::before,html[data-style=boyish] .sheet::before{display:none}
html[data-style=neutral] .sheet,html[data-style=boyish] .sheet{padding-top:28px}
html[data-style=boyish] h1,html[data-style=boyish] h2,html[data-style=boyish] h3,html[data-style=boyish] h4{font-weight:700;letter-spacing:-.01em}
html[data-style=neutral] h1,html[data-style=neutral] h2,html[data-style=neutral] h3,html[data-style=neutral] h4{font-weight:600}
html[data-style=girly] .btn,html[data-style=girly] .panel,html[data-style=girly] .sheet,html[data-style=girly] input,html[data-style=girly] select,html[data-style=girly] textarea,html[data-style=girly] .mem{border-radius:12px}
html[data-style=neutral] .btn,html[data-style=neutral] .panel,html[data-style=neutral] input,html[data-style=neutral] select,html[data-style=neutral] textarea{border-radius:6px}
html[data-style=boyish] .btn,html[data-style=boyish] .panel,html[data-style=boyish] .sheet,html[data-style=boyish] input,html[data-style=boyish] select,html[data-style=boyish] textarea{border-radius:2px}
*{box-sizing:border-box}
html{background:var(--paper);font-size:100%}
html.large{font-size:115%}
body{
  margin:0;min-height:100vh;color:var(--ink);font:400 17px/1.5 var(--body);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.15;margin:0}
p{margin:0}
a{color:var(--rust)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.verline{text-align:center;padding:0 14px 28px;font:12px/1.4 var(--label);letter-spacing:.06em;color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.label,label,.lab{font:700 12px/1.2 var(--label);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.small{font-size:15px}

/* cursor */
html.cur-on{cursor:var(--cur,auto)}
html.cur-on :is(button,a,select,summary,label,[data-act],.day,input[type=checkbox],input[type=radio],input[type=file]){cursor:var(--cur-hover,pointer)}
html.cur-on :is(input[type=text],input[type=search],input[type=email],textarea){cursor:text}
#ring{position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid var(--rust);border-radius:50%;opacity:.55;pointer-events:none;z-index:200;transition:opacity .12s,width .1s,height .1s,margin .1s}
#ring.hide{opacity:0}
#ring.press{width:22px;height:22px;margin:-11px 0 0 -11px;opacity:.8}

/* effects layer */
#fx{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.rip{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--rust);opacity:.35;animation:rip .45s ease-out forwards}
@keyframes rip{to{transform:scale(6);opacity:0}}
.spk{position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;background:var(--caramel);transform:rotate(45deg);animation:spk .6s ease-out forwards}
.spk:nth-child(even){background:var(--rust)}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(225deg) scale(.3);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.pop .cb{animation:pop .3s ease-out}

/* header: a light desk bar, then index tabs attached to the planner sheet */
.top .in{max-width:1200px;margin:0 auto;padding:20px clamp(14px,3vw,28px) 0;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:46px;height:46px;flex:none}
.brand h1{font-size:clamp(25px,4vw,33px);font-weight:700;letter-spacing:-.01em}
.brand .ws{font:400 12.5px/1.2 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);overflow-wrap:anywhere;margin-top:3px}
.who-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.who-box select{width:auto}
.pill{display:inline-block;font:700 11px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--accent);color:var(--accent);padding:6px 8px;border-radius:2px}
nav.tabs{display:flex;gap:4px;padding:14px 0 0 12px;overflow-x:auto;position:relative;z-index:2;margin-bottom:-1px}
nav.tabs button{flex:none;margin-top:6px;background:var(--paper-lo);color:var(--ink-soft);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:11px 18px 10px;min-height:44px;font:700 13px/1 var(--label);letter-spacing:.08em;text-transform:uppercase}
nav.tabs button:hover{background:var(--linen);color:var(--ink)}
nav.tabs button[aria-current=page]{margin-top:0;padding-top:17px;background:var(--card);color:var(--ink);box-shadow:inset 0 4px 0 var(--accent)}
.sheet{position:relative;background:var(--card);border:1px solid var(--line);padding:50px clamp(14px,3vw,30px) 30px;box-shadow:0 5px 0 -1px var(--card),0 6px 0 -1px var(--line),0 16px 24px -18px var(--shadow)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:34px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,transparent 15px,var(--coil) 15px 21px,transparent 21px) 0 5px/36px 22px repeat-x,
             radial-gradient(circle at 18px 20px,var(--hole) 0 5.5px,transparent 6px) 0 0/36px 34px repeat-x}

main{max-width:1200px;margin:0 auto;padding:0 clamp(14px,3vw,28px) 70px}
.banner{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--linen);border:1px solid var(--line);border-left:6px solid var(--accent);padding:12px 16px;margin-bottom:18px}
.banner.bad{border-left-color:var(--warn)}
.banner p{flex:1 1 280px}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 13px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:12px 16px;border:0;border-radius:2px;background:var(--accent);color:var(--on-accent);min-height:44px}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.btn.soft{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.soft:hover{background:var(--wash);filter:none}
.btn.soft[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.btn.quiet{background:none;color:var(--accent);box-shadow:none;text-decoration:underline;text-underline-offset:4px;padding:10px 8px}
.btn.danger{background:var(--warn);color:#fff8f0}
html[data-theme=dark] .btn.danger{color:#2a1410}
.btn[disabled],button[disabled]{opacity:.55;filter:none}
.btn.sm{min-height:40px;padding:9px 12px;font-size:12px}
input,select,textarea{background:var(--field);color:var(--ink);border:1px solid var(--caramel);border-radius:2px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:96px;resize:vertical}
.field{display:grid;gap:6px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.err{background:#f3dccd;border:1px solid var(--rust);color:#5e2f1a;padding:10px 14px;border-radius:3px;font-size:16px}
html[data-theme=dark] .err{background:#4a2a20;color:#ffd9c9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.chk{display:flex;gap:10px;align-items:center;font:400 16px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--ink)}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}

/* avatars, chips */
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c,#6f4a33);color:#fff;font:700 11px/1 var(--label);flex:none}
.av{overflow:hidden}
.avrow{display:flex;flex-wrap:wrap;gap:10px}.avsw{position:relative;width:36px;height:36px}.avsw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}.avsw span{display:block;width:100%;height:100%;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.25);box-sizing:border-box}.avsw input:checked+span{outline:3px solid currentColor;outline-offset:2px}.avsw input:focus-visible+span{outline:3px solid #06c;outline-offset:2px}.avprev{width:160px;height:160px;border-radius:50%;overflow:hidden;display:block;margin:0 auto}
.cyd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;font:600 14px var(--label);background:var(--field);color:var(--ink)}
.cyd.on{border-color:transparent}
.dz{border:2px solid var(--warn);border-radius:8px;padding:16px 18px;margin-top:32px}
.dz h3{color:var(--warn);margin-top:0}
button.cyd{padding:0;cursor:pointer;width:100%;position:relative}
.cyd .pv{position:absolute;right:3px;bottom:3px;min-width:17px;height:17px;padding:0 3px;box-sizing:border-box;border-radius:9px;background:rgba(255,255,255,.94);color:#3b281d;font:700 11px/17px var(--label);text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
@media (max-width:520px){.cyd .pv{min-width:15px;height:15px;font-size:10px;line-height:15px;right:2px;bottom:2px}}
button.cyd:hover{filter:brightness(.96)}
button.cyd:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* panels */
/* Animated panels mark the places where you can customize how Family Board looks (Appearance and Your profile). */
@property --ga{syntax:'<angle>';initial-value:0deg;inherits:false}

/* month grid */

.dots{display:flex;gap:3px;height:6px}

.day.other{background:var(--paper-lo);opacity:.8}
.day:hover{background:var(--linen)}
.dnum{align-self:flex-start;background:none;border:0;padding:2px 6px;min-height:34px;font:700 19px/1 var(--display);display:flex;gap:8px;align-items:center;border-radius:2px}
.dnum:hover{background:var(--wash)}
.day.other .dnum{font-weight:400}
.day.today{background:var(--today);box-shadow:inset 0 3px 0 var(--accent)}
.day.today .dnum{background:var(--accent);color:var(--on-accent)}
.day.today .dnum small{font:700 10px/1 var(--label);letter-spacing:.1em;text-transform:uppercase}
.chip{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gc,var(--caramel));padding:4px 6px;min-width:0}
.chip .cb{width:20px;height:20px;margin:1px 0 0;border-width:2px}
.chip .cb:checked::after{width:5px;height:10px;border-width:0 2px 2px 0}
.chip .tmain{gap:0;min-height:26px}
.chip .ttitle{font-size:14px;line-height:1.2}

.more{background:none;border:0;text-align:left;padding:4px 6px;min-height:32px;font:700 12px/1 var(--label);letter-spacing:.06em;color:var(--rust);text-decoration:underline}
.agenda-day{margin-top:16px}

.only-narrow{display:none}

/* groups */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.gcard{background:var(--field);border:1px solid var(--line);border-left:10px solid var(--gc);padding:16px;display:grid;gap:10px;align-content:start}

.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}

dialog{border:1px solid var(--line);border-top:6px solid var(--accent);background:var(--card);color:var(--ink);padding:0;width:min(94vw,640px);max-height:92vh;box-shadow:0 24px 50px -20px var(--shadow)}

@media (max-width:719px){

.story{text-align:center;padding:8px 0 4px}

.story .ln:nth-child(2){animation-delay:3s}.story .ln:nth-child(3){animation-delay:6s}.story .ln:nth-child(4){animation-delay:9s}
@keyframes stln{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0}}
.story .walker{animation:stwalk 12s infinite}
@keyframes stwalk{0%{transform:translateX(0)}50%,56%{transform:translateX(158px);opacity:1}64%{transform:translateX(168px);opacity:0}99%{transform:translateX(168px);opacity:0}100%{transform:translateX(0);opacity:0}}

@keyframes stbob{to{transform:translateY(-2px)}}

@keyframes stdoor{0%,48%{transform:scaleX(1)}56%,70%{transform:scaleX(.15)}78%,100%{transform:scaleX(1)}}

}
@media print{nav.tabs,.btn,#ring,#fx{display:none!important}.sheet::before{display:none}.sheet{padding-top:20px}}
</style>

<script>
(()=>{
'use strict';

/* =====================================================================
   1. Helpers
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);

  if(!t.due)return[];

  const out=[],end=parseYmd(t.due);
  for(let d=parseYmd(t.start);d<=end&&out.length<=MAXSPAN;d.setDate(d.getDate()+1))out.push(ymd(d));

const onDay=(t,k)=>isLong(t)?k>=t.start&&k<=t.due:t.due===k;

function shiftStr(s,code){
  const d=parseYmd(s),n=+code.slice(1),u=code[0];
  if(u==='d'||u==='w'){d.setDate(d.getDate()+n*(u==='w'?7:1));return ymd(d)}
  const day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+n*(u==='y'?12:1),1);
  t.setDate(Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return ymd(t);
}
function nextDates(t){   // the next copy of a repeating task: the first date after the due date that is not in the past
  if(!t.repeat||!REPCODES.has(t.repeat)||!t.due)return null;
  let n=shiftStr(t.due,t.repeat),i=0;const today=todayStr();
  while(n<today&&i++<4000)n=shiftStr(n,t.repeat);
  const span=isLong(t)?Math.round((parseYmd(t.due)-parseYmd(t.start))/864e5):0;
  const d=parseYmd(n);d.setDate(d.getDate()-span);
  return{due:n,start:span?ymd(d):''};
}

function parseSteps(text,old){
  const pool=(old||[]).slice(),out=[];
  String(text||'').split('\n').map(l=>l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/,'').trim()).filter(Boolean).slice(0,MAXSTEPS).forEach(line=>{
    line=line.slice(0,120);const i=pool.findIndex(p=>p.text.toLowerCase()===line.toLowerCase());
    if(i>=0){const p=pool.splice(i,1)[0];out.push({id:p.id,text:line,done:p.done})}else out.push({id:uid(),text:line,done:false});
  });
  return out;
}

function ev(type,actor,at,extra){return{id:uid(),type,at:at||new Date().toISOString(),actorId:actor.id,actorName:actor.name,...extra}}
function makeTask(f,actor,at){
  const t={id:uid(),title:f.title,description:f.description||'',due:f.due||'',time:f.due?(f.time||''):'',start:f.due?(f.start||''):'',perDay:f.perDay||0,repeat:f.due?(f.repeat||''):'',assigneeIds:uniqIds(f.assigneeIds||[f.assigneeId]).slice(0,MAXWHO),groupId:f.groupId||'',special:!!(f.special&&f.due),steps:cleanSteps(f.steps),
    status:'open',completedBy:'',completedByName:'',completedForId:'',completedForName:'',completedAt:'',createdAt:at||new Date().toISOString(),sample:!!f.sample,history:[]};
  t.history.push(ev('created',actor,t.createdAt,{assigneeName:aIds(t).length?namesOf(aIds(t)):''}));
  return t;
}
function applyComplete(t,actor,at){
  if(t.status==='complete')return;
  const as=aIds(t).map(member).filter(Boolean),forM=as.length<=1?as:as.filter(m=>m.id!==actor.id);
  t.status='complete';t.completedBy=actor.id;t.completedByName=actor.name;t.completedAt=at||new Date().toISOString();
  t.completedForId=forM[0]?forM[0].id:'';t.completedForName=forM.map(m=>m.name).join(', ');
  t.history.push(ev('completed',actor,t.completedAt,{forName:t.completedForName}));
}
function applyReopen(t,actor){
  if(t.status!=='complete')return;
  t.history.push(ev('reopened',actor,null,{fromName:t.completedByName}));
  t.status='open';t.completedBy='';t.completedByName='';t.completedForId='';t.completedForName='';t.completedAt='';
}
function applyAssign(t,newIds,actor){
  newIds=uniqIds(newIds).slice(0,MAXWHO);
  if(sameIds(aIds(t),newIds))return;
  t.history.push(ev('assigned',actor,null,{fromName:namesOf(aIds(t)),toName:namesOf(newIds)}));
  t.assigneeIds=newIds;
}
function applyGroup(t,newId,actor){
  if((t.groupId||'')===(newId||''))return;
  const g0=group(t.groupId),g1=group(newId);
  t.history.push(ev('group',actor,null,{fromName:g0?g0.name:'No group',toName:g1?g1.name:'No group'}));
  t.groupId=newId||'';
}

function ripple(x,y){
  const s=document.createElement('span');s.className='rip';s.style.left=x+'px';s.style.top=y+'px';
  $('#fx').appendChild(s);s.addEventListener('animationend',()=>s.remove());
}
function sparkle(x,y){
  const fx=$('#fx');
  for(let i=0;i<7;i++){
    const s=document.createElement('span'),a=(Math.PI*2*i)/7,r=22+(i%2)*8;
    s.className='spk';s.style.left=x+'px';s.style.top=y+'px';

  }
}

const avatar=(m,cls='')=>{
  if(!m)return`<span class="av none ${cls}" aria-hidden="true">?</span>`;
  const dm=m.dm&&DMRE.test(m.dm)&&navigator.onLine!==false?`<img class="dm" src="https://www.doppelme.com/${cls==='lg'||cls==='xl'?'':'50/'}${esc(m.dm)}/cropb.png" alt="" referrerpolicy="no-referrer" loading="lazy">`:'';
  return`<span class="av ${cls}" style="--c:${esc(m.color)}" aria-hidden="true"><span class="avin">${okAvatar(m.avatar)?`<img src="${esc(m.avatar)}" alt="">`:esc(initials(m.name))}</span>${dm}</span>`};
document.addEventListener('load',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('dm'))t.classList.add('ok')},true);
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('dm'))t.remove()},true);   // offline or DoppelMe down: the photo, avatar or letter underneath shows
const whoTags=t=>{const ms=aIds(t).map(member).filter(Boolean);
  if(ms.length<=1)return whoTag(ms[0]?ms[0].id:'');
  return`<span class="who">${ms.slice(0,4).map(m=>avatar(m)).join('')}<span>${esc(ms.map(m=>m.name).join(', '))}</span></span>`};
const whoTag=id=>{const m=member(id);return`<span class="who">${avatar(m)}<span>${esc(m?m.name:'Unassigned')}</span></span>`};
const gTag=g=>g?`<span class="gtag" style="--gc:${esc(g.color)}">${esc(g.name)}</span>`:'';
const dueText=t=>t.due?(isLong(t)?spanText(t):fmtDate(t.due,{weekday:'short',month:'short',day:'numeric'}))+(t.time?' · '+fmtTime(t.time):''):'No due date';
const statusTag=t=>t.status==='complete'?'<span class="stat ok">✓ Complete</span>':isOverdue(t)?'<span class="stat late">! Overdue</span>':'<span class="stat">Incomplete</span>';

function statTag(t){const s=stepStat(t);return s?`<span class="stat" title="Steps finished">☑ ${s.d} of ${s.n} steps</span>`:''}
function taskRow(t,ctx){
  const g=group(t.groupId),done=t.status==='complete';
  return`<div class="task${done?' done':''}${UI.popId===t.id?' pop':''}" style="--gc:${g?esc(g.color):'transparent'}">
    <input type="checkbox" class="cb" data-cb="${t.id}" data-fk="cb-${ctx}-${t.id}" ${done?'checked':''} aria-label="Mark “${esc(t.title)}” complete">
    <button type="button" class="tmain" data-act="open" data-id="${t.id}" data-fk="open-${ctx}-${t.id}">
      <span class="ttitle">${esc(t.title)}</span>
      <span class="tmeta">${whoTags(t)}${gTag(g)}<span>${esc(dueText(t))}</span>${t.repeat?`<span class="stat" title="Repeats">↻ ${esc(repLabel(t.repeat))}</span>`:''}${perDayText(t.perDay)?`<span class="stat">${esc(perDayText(t.perDay))}</span>`:''}${statTag(t)}${statusTag(t)}${t.special?'<span class="stat spc">◯ Special occasion</span>':''}</span>
    </button></div>`;
}
function chip(t,k){
  const g=group(t.groupId),done=t.status==='complete';
  return`<div class="chip${done?' done':''}${UI.popId===t.id?' pop':''}" style="--gc:${g?esc(g.color):'var(--caramel)'}">
    <input type="checkbox" class="cb" data-cb="${t.id}" data-fk="cb-cal-${t.id}" ${done?'checked':''} aria-label="Mark “${esc(t.title)}” complete">
    <button type="button" class="tmain" data-act="open" data-id="${t.id}" data-fk="open-cal-${t.id}">
      <span class="ttitle">${t.repeat?'<span aria-hidden="true">↻ </span>':''}${esc(t.title)}${done?'<span class="sr"> (complete)</span>':''}</span>
      <span class="cm">${isLong(t)&&k?'Day '+(Math.round((parseYmd(k)-parseYmd(t.start))/864e5)+1)+' of '+(Math.round((parseYmd(t.due)-parseYmd(t.start))/864e5)+1)+' · ':''}${esc(namesOf(aIds(t)))}${g?' · '+esc(g.name):''}${t.time?' · '+esc(fmtTime(t.time)):''}${stepStat(t)?' · '+stepStat(t).d+'/'+stepStat(t).n:''}</span>
    </button></div>`;
}
const pass=t=>{
  const f=UI.f;
  if(f.person==='none'&&aIds(t).length)return false;
  if(f.person!=='all'&&f.person!=='none'&&!aIds(t).includes(f.person))return false;
  if(f.group==='none'&&t.groupId)return false;
  if(f.group!=='all'&&f.group!=='none'&&t.groupId!==f.group)return false;
  if(f.status==='open'&&t.status==='complete')return false;
  if(f.status==='done'&&t.status!=='complete')return false;
  return true;
};
const sel=(id,label,opts,val,extra='')=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" ${extra}>${opts.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(val)?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;

  return`<nav class="tabs" aria-label="Main">${tabs.map(t=>`<button type="button" data-act="nav" data-v="${t[0]}" data-fk="nav-${t[0]}" ${(UI.view===t[0]||(UI.view==='group'&&t[0]==='groups'))?'aria-current="page"':''}>${t[1]}</button>`).join('')}</nav>`;
}

/* ---- calendar ---- */
const XMARK='<svg class="xmark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M9 8C30 30 62 66 91 93"/><path d="M92 9C70 32 34 64 8 91"/></svg>';
const CIRCLE='<svg class="circ" viewBox="0 0 44 44" aria-hidden="true"><path d="M6 24C4 11 17 3 28 6c12 3 15 18 8 28-7 9-24 8-29-3-1-2-1-4-1-7 0-3 4-10 10-13"/></svg>';
function filtersHTML(){
  const f=UI.f;
  return`<div class="filters">
    ${sel('f-person','Person',[['all','Everyone'],['none','Unassigned'],...D.members.map(m=>[m.id,m.name])],f.person,'data-act="filter" data-k="person" data-fk="f-person"')}
    ${sel('f-group','Task group',[['all','All groups'],['none','No group (standalone)'],...D.groups.map(g=>[g.id,g.name])],f.group,'data-act="filter" data-k="group" data-fk="f-group"')}
    ${sel('f-status','Status',[['all','All'],['open','Incomplete'],['done','Complete']],f.status,'data-act="filter" data-k="status" data-fk="f-status"')}</div>`;
}
function calendarView(){
  const m=UI.month,yr=m.getFullYear(),mo=m.getMonth();
  const title=m.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const first=new Date(yr,mo,1),lead=first.getDay(),days=new Date(yr,mo+1,0).getDate(),rows=Math.ceil((lead+days)/7);
  const list=D.tasks.filter(pass);
  const byDay={};list.filter(t=>t.due).forEach(t=>{taskDays(t).forEach(k=>{(byDay[k]=byDay[k]||[]).push(t)})});
  Object.values(byDay).forEach(a=>a.sort(byDate));
  const tdy=todayStr();
  let cells='',mcells='';
  const crossing=ST.crossOff;
  for(let i=0;i<rows*7;i++){
    const d=new Date(yr,mo,1-lead+i),k=ymd(d),ts=byDay[k]||[];
    const past=crossing&&k<tdy,spc=ts.some(t=>t.special),other=d.getMonth()!==mo;
    const longDate=fmtDate(k,{weekday:'long',month:'long',day:'numeric'});
    const note=(past?'. This day has passed.':'')+(spc?'. Special occasion.':'');
    cells+=`<div class="day${other?' other':''}${k===tdy?' today':''}${past?' crossed':''}${spc?' special':''}" data-date="${k}">
      ${past?XMARK:''}
      <button type="button" class="dnum" data-act="addday" data-date="${k}" data-fk="day-${k}" aria-label="Add a task on ${esc(longDate)}${note}"${k===tdy?' aria-current="date"':''}><span class="dn">${d.getDate()}${spc?CIRCLE:''}</span>${k===tdy?'<small>Today</small>':''}</button>
      ${ts.slice(0,3).map(t=>chip(t,k)).join('')}
      ${ts.length>3?`<button type="button" class="more" data-act="daylist" data-date="${k}">+${ts.length-3} more</button>`:''}</div>`;
    mcells+=`<button type="button" class="mday${other?' other':''}${k===tdy?' today':''}" data-act="daylist" data-date="${k}" data-fk="md-${k}" aria-label="${esc(longDate)}, ${ts.length} task${ts.length===1?'':'s'}${note}"${k===tdy?' aria-current="date"':''}>
      ${past?XMARK:''}<span class="dn">${d.getDate()}${spc?CIRCLE:''}</span><span class="dots" aria-hidden="true">${ts.slice(0,4).map(t=>{const g=group(t.groupId);return`<i style="--c:${g?esc(g.color):'var(--caramel)'}"></i>`}).join('')}</span></button>`;
  }
  const legend=`<p class="legend muted small"><span>${crossing?'<svg class="lx" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 4l14 15M18 4L4 18"/></svg>Day has passed':''}</span><span><svg class="lc" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 12C2 6 8 2 13 3c5 1 7 7 4 12-3 4-9 4-12 0-1-1-2-3-2-5 0-3 3-6 6-7"/></svg>Special occasion</span></p>`;
  const mini=`<div class="mini" role="group" aria-label="${esc(title)}">${['S','M','T','W','T','F','S'].map((w,i)=>`<div class="dow" aria-hidden="true">${w}</div>`).join('')}${mcells}</div>`;
  const agendaDays=Object.keys(byDay).filter(k=>k.slice(0,7)===yr+'-'+pad(mo+1)).sort();
  const agenda=agendaDays.length?agendaDays.map(k=>`<section class="agenda-day"><h3>${esc(fmtDate(k,{weekday:'long',month:'long',day:'numeric'}))}${k===tdy?' · Today':''}</h3>${byDay[k].map(t=>taskRow(t,'ag')).join('')}</section>`).join(''):`<div class="empty">No tasks on the calendar this month${UI.f.person!=='all'||UI.f.group!=='all'||UI.f.status!=='all'?' with these filters':''}. Use “Add task” to create one.</div>`;
  const undated=D.tasks.filter(t=>!t.due&&pass(t)).sort(byDate);
  const narrow=innerWidth<720, agendaMode=ST.calMode==='agenda'||narrow;
  return`<div class="page-head"><h2 class="sr">Calendar</h2></div>
    <div class="cal-bar">
      <button class="btn soft" data-act="prev" aria-label="Previous month" data-fk="prev">‹ Prev</button>
      <h2 aria-live="polite">${esc(title)}</h2>
      <button class="btn soft" data-act="next" aria-label="Next month" data-fk="next">Next ›</button>
      <button class="btn soft" data-act="today" data-fk="today">Today</button>
      <span class="sp"></span>
      <span class="seg view-toggle" role="group" aria-label="Calendar layout"><button class="btn soft" data-act="calmode" data-m="month" aria-pressed="${!agendaMode}" data-fk="m-month">Month</button><button class="btn soft" data-act="calmode" data-m="agenda" aria-pressed="${agendaMode}" data-fk="m-agenda">Agenda</button></span>
      <button class="btn" data-act="addtask" data-fk="addtop">+ Add task</button></div>
    ${filtersHTML()}
    ${narrow?mini+agenda:agendaMode?agenda:`<div class="cal cal-only" role="group" aria-label="${esc(title)}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w=>`<div class="dow">${w}</div>`).join('')}${cells}</div>`}
    ${legend}
    <section class="panel" aria-labelledby="und-h"><h3 id="und-h">No due date (${undated.length})</h3>
      ${undated.length?undated.map(t=>taskRow(t,'un')).join(''):'<p class="muted">Every task that matches the filters has a due date.</p>'}</section>`;
}

/* ---- my tasks ---- */
function myView(){
  const u=me();
  const mine=D.tasks.filter(t=>aIds(t).includes(u.id));
  const open=mine.filter(t=>t.status!=='complete').sort(byDate);
  const done=mine.filter(t=>t.status==='complete').sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt)));
  const forOthers=D.tasks.filter(t=>t.status==='complete'&&t.completedBy===u.id&&t.completedForId&&t.completedForId!==u.id).sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt)));
  const sec=(h,l,empty,c)=>`<section class="panel"><h3>${h} (${l.length})</h3>${l.length?l.map(t=>taskRow(t,c)).join(''):`<p class="muted">${empty}</p>`}</section>`;
  return`<div class="page-head"><h2>My Tasks · ${esc(u.name)}</h2><button class="btn" data-act="addtask" data-assignee="${esc(u.id)}" data-fk="addmine">+ Add task for me</button></div>
    <p class="muted">Showing tasks assigned to you.</p>
    ${sec('To do',open,'Nothing assigned to you is waiting.','my1')}
    ${sec('Completed',done,'Nothing assigned to you has been completed yet.','my2')}
    ${sec('Checked off by you for someone else',forOthers,'You have not checked off anyone else’s tasks.','my3')}`;
}

const SHOPKEY='familyBoard.products.v1';
const httpUrl=s=>{s=String(s||'').trim();if(!/^https?:\/\//i.test(s))return'';try{return new URL(s).href}catch{return''}};
let SHL=null;
function shopLocal(){
  if(SHL)return SHL;
  let a=[];try{a=JSON.parse(localStorage.getItem(SHOPKEY)||'[]')}catch{}

  return SHL;
}
function shopSaveLocal(){try{localStorage.setItem(SHOPKEY,JSON.stringify(SHL||[]))}catch{toast('That change could not be saved to this browser.',true)}}
const shopItems=()=>CL.on?(CL.products||[]):shopLocal();

async function shopClick(a,b,id){
  switch(a){
    case'shopnew':openProductForm(null);return true;
    case'shopedit':{const p=shopGet(id);if(p)openProductForm(p);return true}
    case'shoplow':{const p=shopGet(id);if(p)openLowForm(p);return true}
    case'shopbought':{
      const p=shopGet(id);if(!p)return true;
      if(CL.on)await cloudDo(()=>rpc('product_bought',{p_id:id}),'Marked as bought.');
      else{Object.assign(p,{low:false,qty:0,opened:false,goneBy:'',by:'',at:''});shopSaveLocal();render();toast('Marked as bought.')}
      return true;
    }
    case'shopdel':{
      const p=shopGet(id);if(!p)return true;
      if(!await confirmBox('Delete “'+p.name+'”?','It is removed from the shopping list'+(CL.on?' for everyone in the workspace.':'.'),'Delete product',true))return true;
      if(CL.on)await cloudDo(()=>rpc('product_delete',{p_id:id}),'Product deleted.');
      else{SHL=shopLocal().filter(x=>x.id!==id);shopSaveLocal();render();toast('Product deleted.')}
      return true;
    }
  }
  return false;
}
function shopSubmit(f){
  if(f.id==='shopform'){
    const name=$('#sp-name').value.trim(),raw=$('#sp-url').value.trim(),er=$('#sperr'),id=f.dataset.id;
    if(!name){er.textContent='Give the product a name.';er.hidden=false;$('#sp-name').focus();return true}
    const url=raw?httpUrl(raw):'';
    if(raw&&!url){er.textContent='The link must start with http:// or https://';er.hidden=false;$('#sp-url').focus();return true}
    if(CL.on)cloudDo(()=>rpc('product_save',{p_id:id||null,p_ws:CL.wsId,p_name:name,p_url:url||null}),id?'Product saved.':'Product added.').then(ok=>{if(ok)closeDlg()});
    else{
      if(id){const p=shopGet(id);if(p)Object.assign(p,{name,url})}
      else shopLocal().push({id:uid(),name,url,low:false,qty:0,opened:false,goneBy:'',by:'',at:''});
      shopSaveLocal();closeDlg();render();toast(id?'Product saved.':'Product added.');
    }
    return true;
  }
  if(f.id==='shoplow'){
    const id=f.dataset.id,er=$('#slerr'),qraw=$('#sl-qty').value.trim(),date=$('#sl-date').value;
    if(!/^\d{1,3}$/.test(qraw)){er.textContent='Enter how many are left, from 0 to 999.';er.hidden=false;$('#sl-qty').focus();return true}
    const qty=parseInt(qraw,10),opened=($('input[name=sl-open]:checked')||{}).value==='yes';
    if(CL.on)cloudDo(()=>rpc('product_low',{p_id:id,p_qty:qty,p_opened:opened,p_gone_by:date||null}),'Alert sent. Everyone else in the workspace has been told.').then(ok=>{if(ok)closeDlg()});
    else{const p=shopGet(id);if(p)Object.assign(p,{low:true,qty,opened,goneBy:date,by:'',at:new Date().toISOString()});shopSaveLocal();closeDlg();render();toast('Saved as running low.')}
    return true;
  }
  return false;
}

const whoPicked=()=>$$('input[name=t-who]:checked').map(x=>x.value);
function readLong(due){   // shared by local and shared mode
  const start=($('#t-start')||{}).value||'',perDay=+(($('#t-perday')||{}).value||0),repeat=($('#t-repeat')||{}).value||'';
  if(start&&!parseYmd(start))return{err:'That start date is not valid.'};
  if(start&&!due)return{err:'Add a due date too. A long task runs from the start date to the due date.'};
  if(start&&start>due)return{err:'The start date has to be on or before the due date.'};
  if(start&&Math.round((parseYmd(due)-parseYmd(start))/864e5)>=MAXSPAN)return{err:'A long task can run for up to '+MAXSPAN+' days.'};
  if(repeat&&!due)return{err:'Add a due date to repeat a task. The next one is based on it.'};
  if(repeat&&!REPCODES.has(repeat))return{err:'Pick one of the repeat choices.'};
  if(perDay&&!start)return{err:'Time per day is for long tasks. Add a start date, or set it back to Not set.'};
  return{start:start===due?'':start,perDay:start&&start!==due?perDay:0,repeat};
}
function submitTask(form){
  const err=$('#terr'),title=$('#t-title').value.trim(),due=$('#t-due').value,time=$('#t-time').value,special=$('#t-special').checked;
  const bad=m=>{err.textContent=m;err.hidden=false;return false};
  if(!title)return bad('Give the task a title.')&&0||$('#t-title').focus();
  if(!form.dataset.id&&title.toLowerCase()==='testtt'){closeDlg();toast('Test emails only work in shared mode, where you are signed in.',true);return}
  if(due&&!parseYmd(due))return bad('That due date is not valid.');
  if(time&&!due){$('#t-time').closest('details').open=true;return bad('Add a due date to use a due time, or clear the time.')}
  if(special&&!due)return bad('Add a due date so the day can be circled.');
  const lg=readLong(due);if(lg.err)return bad(lg.err);
  const f={title,description:$('#t-desc').value.trim(),due,time:due?time:'',start:lg.start,perDay:lg.perDay,repeat:lg.repeat,special,assigneeIds:whoPicked(),groupId:$('#t-group').value};
  const actor=me(),id=form.dataset.id;
  f.steps=parseSteps($('#t-steps').value,id&&task(id)?task(id).steps:[]);
  if(!id){
    const t=makeTask(f,actor);D.tasks.push(t);closeDlg();commit('Task added.','Task added: '+title);
    if(due){const d=parseYmd(due);UI.month=new Date(d.getFullYear(),d.getMonth(),1);render()}
    return;
  }
  const t=task(id);if(!t){closeDlg();return}
  const ch=[];
  if(t.title!==f.title)ch.push('title');
  if(t.description!==f.description)ch.push('description');
  if(t.due!==f.due)ch.push('due date');
  if(t.time!==f.time)ch.push('due time');
  if(!!t.special!==f.special)ch.push('special occasion');
  if((t.start||'')!==f.start)ch.push('start date');
  if((t.perDay||0)!==f.perDay)ch.push('time per day');
  if((t.repeat||'')!==f.repeat)ch.push('repeat');
  if(JSON.stringify(t.steps.map(s=>s.text))!==JSON.stringify(f.steps.map(s=>s.text)))ch.push('steps');
  Object.assign(t,{title:f.title,description:f.description,due:f.due,time:f.time,start:f.start,perDay:f.perDay,repeat:f.repeat,special:f.special,steps:f.steps});
  if(ch.length)t.history.push(ev('edited',actor,null,{fields:ch.join(', ')}));
  applyAssign(t,f.assigneeIds,actor);applyGroup(t,f.groupId,actor);
  closeDlg();commit('Task saved.','Task saved: '+title);
}

async function toggleStep(tid,sid,on){

  const steps=t.steps.map(x=>x.id===sid?{...x,done:on}:x);
  const allDone=steps.length&&steps.every(x=>x.done);
  if(CL.on){
    const ok=await cloudDo(()=>patchTask(tid,{steps}),null);
    if(ok&&allDone&&t.status!=='complete')toast('All steps are done. Mark the task complete when you are ready.');
    return;
  }
  t.steps=steps;commit(null);
  if(allDone&&t.status!=='complete')toast('All steps are done. Mark the task complete when you are ready.');
}

/* =====================================================================
   9. Shared mode (Supabase, plain fetch, no libraries)
   Everything the server must be trusted for (who checked a task off,
   who reopened it, who may see a workspace) is enforced by the database
   rules in supabase-setup.sql. This page only asks and displays.
   ===================================================================== */
const cfgStored=()=>{try{const c=JSON.parse(localStorage.getItem(CFGKEY));return c&&typeof c.url==='string'&&typeof c.key==='string'?c:null}catch{return null}};
function cloudCfg(){
  if(CLOUD_CONFIG.url&&CLOUD_CONFIG.anonKey)return{url:CLOUD_CONFIG.url.trim().replace(/\/+$/,''),key:CLOUD_CONFIG.anonKey.trim(),builtIn:true};
  const c=cfgStored();
  return c&&c.url&&c.key?{url:c.url.replace(/\/+$/,''),key:c.key,builtIn:false}:null;
}
const jwtPayload=t=>{const p=String(t).split('.')[1];if(!p)throw new Error('bad');const b=atob(p.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))};
function urlProblem(u){
  try{const x=new URL(u);if(x.protocol!=='https:')return'The project URL must start with https://';if(x.pathname.replace(/\/+$/,'')!=='')return'Use just the project URL, with nothing after the domain name.'}
  catch{return'That does not look like a web address.'}
  return'';
}
function keyProblem(k){
  if(!k)return'Paste the public anon key.';
  if(/^sb_secret_/i.test(k))return'That is a secret key. Never put it in a web page. Use the public anon (publishable) key.';
  if(/^sb_publishable_/i.test(k))return'';
  if(k.split('.').length!==3)return'That does not look like a Supabase key.';
  try{const p=jwtPayload(k);if(p.role!=='anon')return'That key has the role “'+(p.role||'unknown')+'”. Never put it in a web page. Use the public anon key.'}
  catch{return'That does not look like a valid key.'}
  return'';
}
const colorFor=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length].hex};
const setPending=t=>{CL.pending=t||'';try{t?localStorage.setItem(INVKEY,t):localStorage.removeItem(INVKEY)}catch{}};
function captureInvite(){
  try{
    const q=new URLSearchParams(location.search),t=q.get('invite');
    if(t&&/^[A-Za-z0-9]{20,100}$/.test(t)){setPending(t);q.delete('invite');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''))}
    else CL.pending=localStorage.getItem(INVKEY)||'';
  }catch{}
}

/* ---- session ---- */
const saveSession=s=>{CL.session=s;try{s?localStorage.setItem(SESSKEY,JSON.stringify(s)):localStorage.removeItem(SESSKEY)}catch{}};
function sessionFrom(tok){
  const p=jwtPayload(tok.access_token);
  return{access_token:tok.access_token,refresh_token:tok.refresh_token||'',expires_at:Date.now()+(Number(tok.expires_in)||3600)*1000,user_id:p.sub,email:p.email||''};
}
function readSession(){
  const h=location.hash;
  if(h&&h.length>1&&/(access_token|error)=/.test(h)){
    const p=new URLSearchParams(h.slice(1));
    history.replaceState(null,'',location.pathname+location.search);
    if(p.get('error')){CL.err=(p.get('error_description')||'The sign-in link did not work.')+' Request a new link below.';return null}

    try{return sessionFrom({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_in:p.get('expires_in')})}

const NETERR='Could not reach the server. Check your connection and try again.';
async function api(path,o={}){
  const{method='GET',body,prefer,auth=true}=o;
  if(auth&&CL.session&&CL.session.expires_at-30000<Date.now())await refreshSession();
  const send=()=>{
    const h={apikey:CL.cfg.key,'Content-Type':'application/json',};
    if(auth&&CL.session)h.Authorization='Bearer '+CL.session.access_token;
    else if(CL.cfg.key.split('.').length===3)h.Authorization='Bearer '+CL.cfg.key;
    if(prefer)h.Prefer=prefer;
    return fetch(CL.cfg.url+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  };
  let r;
  try{r=await send()}catch{throw new Error(NETERR)}
  if(r.status===401&&auth&&CL.session){
    if(await refreshSession()){try{r=await send()}catch{throw new Error(NETERR)}}
    if(r.status===401){signOutLocal('Your sign-in expired. Please sign in again.');throw new Error('Your sign-in expired. Please sign in again.')}
  }
  const txt=await r.text();let data=null;
  if(txt){try{data=JSON.parse(txt)}catch{data=txt}}
  if(!r.ok){
    const m=data&&typeof data==='object'?(data.message||data.msg||data.error_description||data.error):'';
    throw new Error(m||('The server answered with an error ('+r.status+').'));
  }
  return data;
}

  if(/assignee_ids/i.test(m))return'Your database needs a small update before a task can be shared with several people. Run supabase-update-all.sql in Supabase.';

async function cloudDo(fn,okMsg){
  if(CL.busy){toast('One moment, the last change is still saving.',true);render();return false}
  CL.busy=true;
  try{await fn()}catch(e){CL.busy=false;toast(dbHint(e.message),true);render();return false}
  try{await cloudLoad()}catch(e){CL.busy=false;CL.stale=true;render();toast('Your change was saved, but the screen could not refresh. '+e.message,true);return true}
  CL.busy=false;render();

  const dlg=$('#dlg');
  if(dlg.open&&dlg.dataset.task){const t=task(dlg.dataset.task);if(t)await cloudShowDetail(t);else closeDlg()}

}

const CYKEY='familyBoard.private.v1';
const CY={exp:{},src:'',loaded:false,gender:'none',on:false,logs:[],noDb:false,month:new Date(new Date().getFullYear(),new Date().getMonth(),1)};
const HEAVY=[['#f6c9c4','Light'],['#ec9a94','Fairly light'],['#d9625c','Medium'],['#b3332a','Heavy'],['#7a1411','Very heavy']];
const YMDRE=/^\d{4}-\d{2}-\d{2}$/;

const cycleGuard=()=>cyOn()?cycleView():calendarView();
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};

const cyDate=(s,o)=>fmtDate(s,o||{weekday:'short',month:'short',day:'numeric'});
function cyDays(a,s,e){
  const seen=new Set(),out=[];
  (Array.isArray(a)?a:[]).forEach(x=>{
    if(!x||!YMDRE.test(x.d||'')||x.d<s||(e&&x.d>e)||seen.has(x.d))return;
    const p=x.pain==null?null:parseInt(x.pain,10),v=x.heaviness==null?null:parseInt(x.heaviness,10);
    const pp=p==null||isNaN(p)?null:Math.min(10,Math.max(0,p)),vv=v==null||isNaN(v)?null:Math.min(5,Math.max(1,v));
    if(pp===null&&vv===null)return;
    seen.add(x.d);out.push({d:x.d,pain:pp,heaviness:vv});
  });
  return out.sort((a,b)=>a.d<b.d?-1:1).slice(0,60);
}
function cySummary(l){
  const ps=l.days.map(x=>x.pain).filter(x=>x!==null),hs=l.days.map(x=>x.heaviness).filter(x=>x!==null);
  l.pain=ps.length?Math.max(...ps):0;l.heaviness=hs.length?Math.round(hs.reduce((a,b)=>a+b,0)/hs.length):3;return l;
}
function cyClean(l){
  if(!l||!YMDRE.test(l.start_date||''))return null;
  const e=l.end_date&&YMDRE.test(l.end_date)&&l.end_date>=l.start_date?l.end_date:'';
  let days=cyDays(l.days,l.start_date,e);
  const lp=Math.min(10,Math.max(0,parseInt(l.pain,10)||0)),lh=Math.min(5,Math.max(1,parseInt(l.heaviness,10)||3));
  if(!days.length&&e&&(lp>0||lh!==3)){   // an entry saved before day-by-day logging: spread its single rating over its days
    for(let d=l.start_date,i=0;d<=e&&i<60;d=addDays(d,1),i++)days.push({d,pain:lp,heaviness:lh});
  }

const cySort=()=>CY.logs.sort((a,b)=>b.start_date<a.start_date?-1:b.start_date>a.start_date?1:0);

async function cySaveLog(rec,isEdit){
  try{
    if(CL.on){
      const body={start_date:rec.start_date,end_date:rec.end_date||null,days:rec.days,pain:rec.pain,heaviness:rec.heaviness};
      if(isEdit){const r=await changeRows('/rest/v1/cycle_logs?id=eq.'+rec.id,'PATCH',body);rec=cyClean(r[0])}
      else{const r=await changeRows('/rest/v1/cycle_logs','POST',{...body,user_id:CL.session.user_id});rec=cyClean(r[0])}
    }else if(!isEdit)rec.id=uid();
    CY.logs=CY.logs.filter(x=>x.id!==rec.id);CY.logs.push(rec);cySort();
    CY.month=new Date(+rec.start_date.slice(0,4),+rec.start_date.slice(5,7)-1,1);
    if(!CL.on)cyLocalSave();
    render();cyRefreshDay();toast('Saved.');return true;
  }catch(e){toast(dbHint(e.message),true);return false}
}
function cySetDay(id,d,k,v){
  const l=CY.logs.find(x=>x.id===id);if(!l)return;
  const cur=l.days.find(x=>x.d===d)||{d,pain:null,heaviness:null};
  const nx={...cur,[k]:cur[k]===v?null:v};   // tapping the chosen value again clears it
  l.days=l.days.filter(x=>x.d!==d);
  if(nx.pain!==null||nx.heaviness!==null)l.days.push(nx);
  l.days.sort((a,b)=>a.d<b.d?-1:1);cySummary(l);
  CY.month=new Date(+d.slice(0,4),+d.slice(5,7)-1,1);   // show the month that was just changed
  render();cyRefreshDay();cyQueueSave(l.id);
}
function cyQueueSave(id){

document.addEventListener('click',async e=>{
  const b=e.target.closest&&e.target.closest('[data-cy]');if(!b||b.type==='radio'||b.type==='checkbox')return;
  const id=b.dataset.id,l=CY.logs.find(x=>x.id===id);
  switch(b.dataset.cy){
    case'log':openCycleForm(null,'start');break;
    case'edit':if(l)openCycleForm(l,'edit');break;
    case'end':if(l)openCycleForm(l,'end');break;
    case'pain':cySetDay(id,b.dataset.d,'pain',+b.dataset.v);break;
    case'flow':cySetDay(id,b.dataset.d,'heaviness',+b.dataset.v);break;
    case'day':openCycleDay(b.dataset.d);break;
    case'startat':{const d=b.dataset.d;if(d&&await cySaveLog(cyClean({id:'',start_date:d,end_date:'',days:[]}),false))openCycleDay(d);break}
    case'del':if(l){
      const n=(l.end_date?daysBetween(l.start_date,l.end_date):daysBetween(l.start_date,todayStr()))+1;
      if(await confirmBox('Delete the whole period?','This removes all '+n+' '+(n===1?'day':'days')+' of the period '+cyDate(l.start_date)+(l.end_date?' to '+cyDate(l.end_date):' (still going)')+', with their pain and flow. Your other periods are not touched.','Delete the whole period',true)){await cyDelete(id);closeDlg()}
    }break;
    case'clearday':{const x=CY.logs.find(y=>y.id===id),d=b.dataset.d;if(x&&d){x.days=x.days.filter(r=>r.d!==d);cySummary(x);render();cyRefreshDay();cyQueueSave(x.id);toast('That day’s pain and flow were cleared.')}break}
    case'rmday':{
      const x=CY.logs.find(y=>y.id===id),d=b.dataset.d;if(!x||!d)break;
      const today=todayStr(),only=x.start_date===d&&(x.end_date===d||(!x.end_date&&d===today));
      const middle=d>x.start_date&&((x.end_date&&d<x.end_date)||(!x.end_date&&d<today));
      const hasData=x.days.some(r=>r.d===d);
      if(only||middle||hasData){
        const msg=only?'This is the only day in the period, so the whole period is deleted.'
          :middle?cyDate(d)+' will no longer count as a period day, and its pain and flow are deleted. The period is split into two.'
          :cyDate(d)+' will no longer count as a period day, and its pain and flow are deleted.';
        if(!await confirmBox(only?'Delete the period?':'Remove this day?',msg,only?'Delete the period':'Remove day',true))break;
      }
      if(only){await cyDelete(id);closeDlg();break}
      if(d===x.start_date){await cySaveLog(cyClean({id:x.id,start_date:addDays(d,1),end_date:x.end_date,days:x.days}),true);break}
      if(x.end_date&&d===x.end_date){await cySaveLog(cyClean({id:x.id,start_date:x.start_date,end_date:addDays(d,-1),days:x.days}),true);break}
      if(!x.end_date&&d===today){await cySaveLog(cyClean({id:x.id,start_date:x.start_date,end_date:addDays(d,-1),days:x.days}),true);toast('Today was removed, so the period now ends yesterday.');break}
      // middle day: keep the days before it in this period and start a second period after it
      const first=cyClean({id:x.id,start_date:x.start_date,end_date:addDays(d,-1),days:x.days});
      const second=cyClean({id:'',start_date:addDays(d,1),end_date:x.end_date,days:x.days});
      if(await cySaveLog(first,true))await cySaveLog(second,false);
      break;
    }
    case'delall':if(await confirmBox('Delete all cycle entries?','All '+CY.logs.length+' '+(CY.logs.length===1?'period':'periods')+' and every pain and flow entry are removed. This cannot be undone.','Delete everything',true))await cyDelete('');break;
    case'mprev':CY.month=new Date(CY.month.getFullYear(),CY.month.getMonth()-1,1);render();break;
    case'mnext':CY.month=new Date(CY.month.getFullYear(),CY.month.getMonth()+1,1);render();break;
  }
});

  if(t.dataset.cb){

    const going=t.checked;
    if(going&&fxOn()){const r=t.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2);UI.popId=tk.id}
    const ok=await cloudComplete(tk,going);
    if(ok)say('“'+tk.title+'” '+(going?'marked complete':'reopened')+' by '+me().name);
    return true;
  }
  if(t.dataset.act==='movegroup'){
    const tk=task(t.dataset.id);if(!tk)return true;
    const none=t.value==='__none';
    await cloudDo(()=>patchTask(tk.id,{group_id:none?null:t.value}),none?'Task removed from the group and kept as a standalone task.':'Task moved.');
    return true;
  }
  if(t.dataset.act==='switchws'){await cloudSwitch(t.value);return true}
  return false;
}
async function cloudSwitch(id){
  if(CL.busy||!id||id===CL.wsId)return;
  const prev=CL.wsId;CL.wsId=id;CL.busy=true;
  try{
    await cloudLoad();
    try{localStorage.setItem(WSKEY,id)}catch{}
    UI.view='calendar';UI.f={person:'all',group:'all',status:'all'};
    CL.busy=false;render();window.scrollTo(0,0);
  }catch(e){CL.wsId=prev;CL.busy=false;toast(e.message,true);render()}
}
function cloudSubmit(f){
  const id=f.id;
  /* connection details work in both modes */
  if(id==='cfgform'){
    const url=$('#cf-url').value.trim(),key=$('#cf-key').value.trim(),er=$('#cferr');
    const p=urlProblem(url)||keyProblem(key);
    if(p){er.textContent=p;er.hidden=false;return true}
    try{localStorage.setItem(CFGKEY,JSON.stringify({url,key}));localStorage.setItem(MODEKEY,'cloud')}
    catch{er.textContent='This browser blocked saving the connection details.';er.hidden=false;return true}
    location.reload();return true;
  }
  if(!CL.on)return false;

  if(id==='pwform'){
    const em=$('#si-email').value.trim(),pw=$('#si-pw').value,up=CL.authMode==='up';
    CL.email=em;CL.sent='';CL.err='';
    const bad=(m,sel)=>{CL.err=m;render();const x=$(sel);if(x)x.focus();return true};
    if(!validEmail(em))return bad('Enter a valid email address.','#si-email');
    if(!pw)return bad('Enter your password.','#si-pw');
    if(up&&pw.length<8)return bad('Choose a password with at least 8 characters.','#si-pw');
    cloudStep(async()=>{
      try{
        if(up){
          const r=await api('/auth/v1/signup',{method:'POST',body:{email:em,password:pw},auth:false});
          if(r&&r.access_token){saveSession(sessionFrom(r));await cloudAfterAuth();return}
          CL.sentKind='confirm';CL.sent=em;return;
        }
        const t=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:em,password:pw},auth:false});
        saveSession(sessionFrom(t));await cloudAfterAuth();
      }catch(e){throw new Error(authErr(e.message))}
    });
    return true;
  }
  if(id==='pwchange'){
    const a=$('#pw1').value,b2=$('#pw2').value,er=$('#pwerr');
    const bad=m=>{er.textContent=m;er.hidden=false;return true};
    if(a.length<8)return bad('Choose a password with at least 8 characters.');
    if(a!==b2)return bad('The two passwords are not the same.');
    (async()=>{
      try{await api('/auth/v1/user',{method:'PUT',body:{password:a}});closeDlg();toast('Password saved. You can use it to sign in.')}
      catch(e){er.textContent=authErr(e.message);er.hidden=false}
    })();
    return true;
  }
  if(id==='nameform'){
    const n=$('#nm-name').value.trim();
    if(!n||n.length>40){CL.err='Enter a name between 1 and 40 characters.';render();return true}
    cloudStep(async()=>{await rpc('set_display_name',{p_name:n});await cloudAfterAuth()});
    return true;
  }
  if(id==='wscreate'){
    const n=$('#ws-name').value.trim();
    if(!n){CL.err='Give the workspace a name.';render();return true}
    cloudStep(async()=>{CL.wsId=await rpc('create_workspace',{p_name:n});try{localStorage.setItem(WSKEY,CL.wsId)}catch{}await cloudAfterAuth();toast('Workspace created.')});
    return true;
  }
  if(id==='joinform'){
    const raw=$('#join-code').value.trim(),m=/invite=([A-Za-z0-9]+)/.exec(raw),tok=m?m[1]:raw;
    if(!/^[A-Za-z0-9]{20,100}$/.test(tok)){CL.err='Paste the full invite link you were sent.';render();return true}
    cloudStep(async()=>{CL.wsId=await rpc('accept_invite',{p_token:tok});try{localStorage.setItem(WSKEY,CL.wsId)}catch{}UI.view='calendar';await cloudAfterAuth();toast('You joined the workspace.')});
    return true;
  }
  if(id==='dnform'){
    const n=$('#dn-name').value.trim(),er=$('#dnerr');
    if(!n||n.length>40){er.textContent='Enter a name between 1 and 40 characters.';er.hidden=false;return true}
    cloudDo(async()=>{await rpc('set_display_name',{p_name:n});CL.profile={display_name:n}},'Name updated.').then(ok=>{if(ok)closeDlg()});
    return true;
  }
  if(id==='wscloud'){
    const n=$('#nw-name').value.trim(),er=$('#wserr');
    if(!n){er.textContent='Give the workspace a name.';er.hidden=false;return true}
    cloudDo(async()=>{CL.wsId=await rpc('create_workspace',{p_name:n});try{localStorage.setItem(WSKEY,CL.wsId)}catch{}await loadMemberships()},'Workspace created.').then(ok=>{if(ok){closeDlg();UI.view='calendar'}});
    return true;
  }
  if(id==='wsform'){
    const n=$('#wsname').value.trim();
    if(!n){toast('Enter a workspace name.',true);return true}
    if(!canManage()){askOwner('rename',{p_name:n});return true}
    cloudDo(async()=>{await changeRows('/rest/v1/workspaces?id=eq.'+CL.wsId,'PATCH',{name:n});await loadMemberships()},'Workspace name saved.');
    return true;
  }
  if(id==='tform'){
    const err=$('#terr'),title=$('#t-title').value.trim(),due=$('#t-due').value,time=$('#t-time').value,special=$('#t-special').checked;
    const bad=m=>{err.textContent=m;err.hidden=false;return true};
    if(!title){err.textContent='Give the task a title.';err.hidden=false;$('#t-title').focus();return true}
    if(!f.dataset.id&&title.toLowerCase()==='testtt'){
      (async()=>{
        try{
          const r=await rpc('send_test_email',{});
          closeDlg();
          toast(r==='sent'?'Test email requested. Check your inbox in a minute (and spam).':r==='wait'?'A test was just sent. Wait a minute and try again.':r==='opted_out'?'Reminder emails are turned off in your Settings, so no test was sent.':'Email is not set up yet. Finish the email setup steps first.',r!=='sent');
        }catch(e){toast(/send_test_email/i.test(e.message||'')?'Your database needs a small update. Run supabase-step-8-test-email.sql in Supabase.':(e.message||'That did not work.'),true)}
      })();
      return true;
    }
    if(due&&!parseYmd(due))return bad('That due date is not valid.');
    if(time&&!due){$('#t-time').closest('details').open=true;return bad('Add a due date to use a due time, or clear the time.')}
    if(special&&!due)return bad('Add a due date so the day can be circled.');
    const lg=readLong(due);if(lg.err)return bad(lg.err);
    const body={title,description:$('#t-desc').value.trim(),due_date:due||null,due_time:due&&time?time:null,assignee_id:whoPicked()[0]||null,group_id:$('#t-group').value||null};
    const tid=f.dataset.id;
    {const w=whoPicked(),o=tid&&task(tid);if(w.length>1||(o&&aIds(o).length>1)){body.assignee_ids=w}}
    {const o=tid&&task(tid);   // only sent when needed, so older databases keep working
      if(lg.start||lg.perDay||lg.repeat||(o&&(o.start||o.perDay||o.repeat))){body.start_date=lg.start||null;body.per_day=lg.perDay||null;body.repeat=lg.repeat||null}}
    {const old=tid&&task(tid)?task(tid).steps:[],st=parseSteps($('#t-steps').value,old);
      if(st.length||old.length)body.steps=st}   // only sent when needed, so older databases keep working
    if(special||(tid&&task(tid)&&task(tid).special))body.special=special;   // only sent when needed, so older databases keep working
    cloudDo(async()=>{
      if(tid)await patchTask(tid,body);
      else await api('/rest/v1/tasks',{method:'POST',body:{workspace_id:CL.wsId,...body},prefer:'return=minimal'});
    },tid?'Task saved.':'Task added.').then(ok=>{
      if(!ok)return;
      closeDlg();
      if(due){const d=parseYmd(due);UI.month=new Date(d.getFullYear(),d.getMonth(),1);render()}
    });
    return true;
  }
  if(id==='gform'){
    const name=$('#g-name').value.trim(),er=$('#gerr');
    if(!name){er.textContent='Give the group a name.';er.hidden=false;$('#g-name').focus();return true}
    const body={name,description:$('#g-desc').value.trim(),color:($('input[name=gcolor]:checked')||{}).value||PALETTE[0].hex},gid=f.dataset.id;
    cloudDo(async()=>{
      if(gid)await changeRows('/rest/v1/groups?id=eq.'+gid,'PATCH',body);
      else await api('/rest/v1/groups',{method:'POST',body:{workspace_id:CL.wsId,...body},prefer:'return=minimal'});
    },gid?'Group saved.':'Group created.').then(ok=>{if(ok)closeDlg()});
    return true;
  }
  if(id==='gdel'){
    const g=group(f.dataset.id);if(!g)return true;
    const mode=($('input[name=gd]:checked')||{}).value||'keep';
    if(mode==='delete'&&!$('#gdok').checked){const er=$('#gdelerr');er.textContent='Tick the box to confirm that the tasks should be deleted too.';er.hidden=false;$('#gdok').focus();return true}
    cloudDo(async()=>{
      if(mode==='delete'){if(tasksIn(g).length)await api('/rest/v1/tasks?group_id=eq.'+g.id,{method:'DELETE'})}
      else if(tasksIn(g).length)await api('/rest/v1/tasks?group_id=eq.'+g.id,{method:'PATCH',body:{group_id:null}});
      await api('/rest/v1/groups?id=eq.'+g.id,{method:'DELETE'});
    },mode==='delete'?'Group and its tasks deleted.':'Group deleted. Its tasks were kept as standalone tasks.').then(ok=>{if(ok){closeDlg();UI.view='groups';render()}});
    return true;
  }
  if(id==='mform'){
    const m=member(f.dataset.id),role=$('#mf-role').value;
    if(!m)return true;
    cloudDo(()=>rpc('set_member_role',{p_ws:CL.wsId,p_user:m.id,p_role:role}),'Role updated.').then(ok=>{if(ok)closeDlg()});
    return true;
  }
  return false;
}

function authErr(m){
  m=m||'';
  if(/invalid login credentials/i.test(m))return'That email and password do not match. If you have not made an account yet, choose Create account.';
  if(/already (been )?registered/i.test(m))return'That email already has an account. Choose Sign in instead.';
  if(/not confirmed/i.test(m))return'This email has not been confirmed yet. Open the confirmation email we sent, or ask the person who runs the site to turn off email confirmation in Supabase.';
  if(/rate limit|too many|seconds/i.test(m))return'Too many tries in a short time. Wait a minute and try again.';
  if(/signups? (not allowed|are disabled)|disabled/i.test(m))return'New accounts are turned off in Supabase. Ask the person who runs the site to turn on email sign-ups.';
  if(/reauth|recent login|nonce/i.test(m))return'For safety, sign out, sign back in, and then try again.';
  if(/same password|different from the old/i.test(m))return'Pick a password you have not used on this account before.';
  return m||'That did not work.';
}

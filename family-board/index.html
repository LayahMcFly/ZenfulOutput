  let h='';
  if(CL.stale)h+='<div class="banner bad" role="alert"><p>The server could not be reached, so what you see may be out of date. Changes will not save until the connection returns.</p><button class="btn soft sm" data-act="retryload">Try again</button></div>';
  if(CL.err&&CL.stage!=='gate'&&CL.stage!=='name'&&CL.stage!=='workspace')h+=`<div class="banner bad" role="alert"><p>${esc(CL.err)}</p><button class="btn soft sm" data-act="dismisserr">Dismiss</button></div>`;
  return h;
}
function myRequestsHTML(){
  if(CL.noReq||canManage())return'';
  const mine=(CL.reqs||[]).filter(r=>r.requester_id===D.currentUserId&&r.workspace_id===CL.wsId).slice(0,8);
  if(!mine.length)return'';
  const what=r=>r.kind==='rename'?'Rename the workspace to “'+r.new_name+'”':r.kind==='invite'?'Invite link':'Remove '+r.target_name;
  const st=r=>r.status==='approved'?'Accepted':r.status==='rejected'?'Rejected':'Waiting for an owner';
  return`<section class="panel"><h3>Your requests</h3>${mine.map(r=>`<div class="mem" style="grid-template-columns:1fr auto"><div><div>${esc(what(r))}</div><div class="muted small">${esc(fmtStamp(r.created_at))}</div></div><div class="row">${r.kind==='invite'&&r.status==='approved'&&r.result_token?`<button class="btn soft sm" data-act="reqlink" data-id="${esc(r.id)}">Show the link</button>`:''}<span class="pill">${st(r)}</span></div></div>`).join('')}</section>`;
}
function cloudMembersView(){
  const u=me(),isOwner=u.role==='owner',mg=canManage(),now=Date.now();
  return`<div class="page-head"><h2>Members and invitations</h2></div>
    <section class="panel" style="margin-top:0"><h3>People in “${esc(D.workspace.name)}”</h3>
      ${D.members.map(m=>{
        const self=m.id===u.id,canRm=self||isOwner||(mg&&m.role!=='owner'),canAsk=!mg&&!self&&m.role!=='owner'&&!CL.noReq;
        return`<div class="mem">${avatar(m,'lg')}<div><div class="nm">${esc(m.name)}${self?' (you)':''}</div><div class="muted small">${roleLabel(m.role)}</div></div>
          <div class="row">${self?'<button class="btn soft sm" data-act="pfp" data-fk="myph">Profile picture</button><button class="btn soft sm" data-act="mydisplayname" data-fk="mydn">Change my name</button>':''}${isOwner&&!self?`<button class="btn soft sm" data-act="editmember" data-id="${esc(m.id)}" data-fk="em-${esc(m.id)}" aria-label="Change role for ${esc(m.name)}">Change role</button>`:''}${canRm?`<button class="btn soft sm" data-act="rmmember" data-id="${esc(m.id)}" data-fk="rm-${esc(m.id)}" aria-label="${self?'Leave workspace':'Remove '+esc(m.name)}">${self?'Leave workspace':'Remove'}</button>`:''}${canAsk?`<button class="btn soft sm" data-act="reqremove" data-id="${esc(m.id)}" data-fk="rq-${esc(m.id)}" aria-label="Ask an owner to remove ${esc(m.name)}">Ask to remove</button>`:''}</div></div>`}).join('')}
      <p class="muted small" style="margin-top:12px">Everyone signs in with their own email address. Names on completed tasks come from each person’s own sign-in, not from a menu.</p></section>
    <section class="panel"><h3>Invitations</h3>
      ${mg?`<p>Create a single-use link and send it to the person yourself, by text or email. <strong>Nothing is emailed from this page.</strong> Each link works once and expires after 7 days.</p>
        <div class="row" style="margin:12px 0"><button class="btn" data-act="createinvite" data-fk="mkinv">Create invite link</button></div>
        ${CL.invites.length?CL.invites.map(i=>{const exp=new Date(i.expires_at).getTime()<now;return`<div class="mem" style="grid-template-columns:1fr auto"><div><div>Link created ${esc(fmtStamp(i.created_at))}</div><div class="muted small">${exp?'Expired':'Expires '+esc(fmtStamp(i.expires_at))} · works once</div></div><div class="row">${exp?'':`<button class="btn soft sm" data-act="copylink" data-token="${esc(i.token)}" aria-label="Copy invite link created ${esc(fmtStamp(i.created_at))}">Copy link</button>`}<button class="btn soft sm" data-act="revokeinvite" data-id="${esc(i.id)}" aria-label="Revoke invite link created ${esc(fmtStamp(i.created_at))}">Revoke</button></div></div>`}).join(''):'<p class="muted">No unused invite links.</p>'}`
      :`<p class="muted">Only an owner or admin can create invite links. You can ask an owner to make one for you.</p>
        ${CL.noReq?'':'<div class="row" style="margin:12px 0"><button class="btn" data-act="reqinvite" data-fk="rqinv">Ask an owner for an invite link</button></div>'}`}</section>${myRequestsHTML()}`;
}
const appearancePanels=()=>`
    <section class="panel glow"><h3>Appearance</h3><div class="two">
      ${sel('s-style','Style',[['girly','Girly'],['neutral','Gender neutral'],['boyish','Boyish'],['bread','Bread']],ST.style,'data-act="style" data-fk="s-style"')}
      ${sel('s-theme','Color theme',[['system','Match my device'],['light','Light'],['dark','Dark']],ST.theme,'data-act="theme" data-fk="s-theme"')}</div>
      ${ST.style==='bread'?`<label class="chk" style="margin-top:12px"><input type="checkbox" data-act="breadbtn" ${ST.breadBtns===true?'checked':''} data-fk="s-breadbtn"> Toasty bread buttons (turn off for plain buttons)</label>`:''}
      <label class="chk" style="margin-top:12px"><input type="checkbox" data-act="large" ${ST.large?'checked':''} data-fk="s-large"> Larger text</label>
      <label class="chk" style="margin-top:10px"><input type="checkbox" data-act="crossoff" ${ST.crossOff?'checked':''} data-fk="s-cross"> Cross off days that have passed, like a fridge calendar</label></section>
    <section class="panel"><h3>Effects</h3>
      <label class="chk"><input type="checkbox" data-act="cursor" ${ST.cursor?'checked':''} data-fk="s-cursor"> Custom cursor (mouse and trackpad only; never on touch screens)</label>
      <label class="chk" style="margin-top:10px"><input type="checkbox" data-act="effects" ${ST.effects?'checked':''} data-fk="s-effects"> Click ripples and the sparkle when a task is completed</label>
      ${RM.matches?'<p class="muted small" style="margin-top:8px">Your device asks for reduced motion, so animations stay off even when this box is ticked.</p>':''}</section>`;
function cfgForm(cfg){
  return`<form id="cfgform" style="display:grid;gap:12px;margin:12px 0" novalidate>
    <p class="err" id="cferr" role="alert" hidden></p>
    <div class="field"><label for="cf-url">Supabase project URL</label><input id="cf-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://abcdxyz.supabase.co" value="${esc(cfg?cfg.url:'')}"></div>
    <div class="field"><label for="cf-key">Public anon key</label><input id="cf-key" type="text" autocomplete="off" spellcheck="false" placeholder="Public anon or publishable key only" value="${esc(cfg?cfg.key:'')}"></div>
    <p class="muted small">These two values are meant to be public. Never paste a service_role or secret key here. The page refuses them.</p>
    <div class="row"><button class="btn" type="submit">Save and use shared mode</button></div></form>`;
}
function collabPanel(){
  const cfg=CL.cfg||cloudCfg();
  let status;
  if(CL.on)status=`<strong>Shared mode is on.</strong> ${CL.session?'Signed in as '+esc(CL.session.email||'your account')+'. ':''}Tasks and activity history are stored on your Supabase project.`;
  else if(cfg)status='Connection details are saved, but this page is in local demo mode, which shares nothing.';
  else status='Not connected. This page is in local demo mode. Follow the setup steps below to share one workspace with your family.';
  return`<section class="panel"><h3>Shared mode (online)</h3><p>${status}</p>
    ${cfg?`<p class="muted small">Server: ${esc((()=>{try{return new URL(cfg.url).host}catch{return cfg.url}})())}${cfg.builtIn?' · connection details are built into this file':''}</p>`:''}
    ${(!cfg||!cfg.builtIn)?cfgForm(cfg):''}
    <div class="row" style="margin-top:12px">${cfg&&!CL.on?'<button class="btn" data-act="usecloud">Switch to shared mode</button>':''}${CL.on?'<button class="btn soft" data-act="uselocal">Switch to local demo mode</button>':''}</div>
    ${backendHelp()}</section>`;
}
function alertsOn(){try{return'Notification' in window&&Notification.permission==='granted'&&localStorage.getItem('familyBoard.alerts.v1')==='on'}catch{return false}}
function settingsViewCloud(){
  const admin=canManage();
  return`<div class="page-head"><h2>Settings</h2></div>
    <section class="panel" style="margin-top:0"><h3>Workspace</h3>
      <form id="wsform" class="row" style="align-items:end" novalidate><div class="field" style="flex:1 1 260px"><label for="wsname">Workspace name</label><input id="wsname" type="text" maxlength="80" value="${esc(D.workspace.name)}" ${admin||!CL.noReq?'':'disabled'}></div><button class="btn" type="submit" ${admin||!CL.noReq?'':'disabled'}>${admin?'Save name':'Ask the owner to rename'}</button></form>
      ${admin?'':'<p class="muted small" style="margin-top:8px">Only an owner or admin can rename the workspace. Type a new name and press the button to ask an owner. They can accept, reject or ignore it.</p>'}
      <div class="row" style="margin-top:14px"><button class="btn soft" data-act="newws" data-fk="newws3">Create another workspace</button></div></section>
    <section class="panel"><h3>Sign-in password</h3>
      <p>Set or change the password you use to sign in. This lets you skip the emailed link.</p>
      <div class="row"><button class="btn soft" data-act="setpw" data-fk="setpw">Set or change password</button></div></section>
    <section class="panel glow"><h3>Your profile</h3>
      <div class="mem" style="grid-template-columns:auto 1fr">${avatar(me(),'xl')}<div><div class="nm">${esc(me().name)}</div>
        <p class="muted small">Everyone in your workspaces sees your name and photo. When you change them, others see the update within about 20 seconds.</p>
        <div class="row" style="margin-top:10px"><button class="btn" data-act="pfp" data-fk="ph">Profile picture</button><button class="btn soft" data-act="mydisplayname" data-fk="mydn2">Change my name</button></div></div></div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">${privateFields()}</div></section>
    <section class="panel"><h3>Assignment alerts</h3>
      ${CL.noNotes?'<p class="err">Your database needs a small update before alerts work. Run supabase-update-notifications.sql in Supabase.</p>':`
      ${notePrefsHTML()}
      <p>You get a message and a red number on the bell when someone assigns you a task. Only the person it is assigned to gets that one. When anyone finishes a task, everyone else in the workspace is told who did it. You are never alerted about your own actions.</p>
      ${AL.msg?`<div class="banner bad" role="alert"><p>${esc(AL.msg)}</p></div>`:('Notification' in window&&Notification.permission==='denied'&&!alertsOn()?`<p class="muted small">Notifications are currently blocked for this site in your browser. The button below will explain how to allow them.</p>`:'')}
      ${alertsOn()?`<p><strong>Device alerts are on.</strong> ${AL.push==='on'?'Alerts also arrive when Family Board is closed.':AL.push==='nodb'?'Background alerts need a database update (run supabase-update-all.sql). Until then, alerts only show while the page is open.':AL.push==='fail'?'Background alerts could not be set up on this device, so alerts only show while the page is open.':pushOK()?'Setting up background alerts…':'This browser can only show alerts while the page is open.'}</p><div class="row"><button class="btn soft" data-act="alertsoff" data-fk="aoff">Turn off device alerts</button>${AL.push==='on'?'<button class="btn soft" data-act="pushtest" data-fk="ptest">Send me a test alert</button>':''}</div>`:'<div class="row"><button class="btn" data-act="alertson" data-fk="aon">Turn on device alerts</button></div>'}
      <p class="muted small" style="margin-top:10px">When device alerts are on and background alerts are set up, your phone or computer shows an alert when a task is assigned to you or finished, even if Family Board is closed. The sound for those alerts is your device’s own notification sound. The chime only plays while the page is open. On an iPhone, alerts only work after you add Family Board to your Home Screen (Share, then Add to Home Screen) and open it from there. No email is sent.</p>`}</section>
    <section class="panel"><h3>Reminders before a task is due</h3>
      ${CL.noPrefs?'<p class="err">Your database needs a small update before reminders work. Run supabase-step-6-reminders.sql in Supabase.</p>':`
      <p>The person who made a task and everyone assigned to it get a reminder a month, a week, 3 days, 2 days and 1 day before it is due. A task with a due time also gets one 12, 6, 3 and 1 hours and 30 minutes before. Reminders show on the bell and as pop-up and phone alerts, in your own time zone (${esc((()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch{return'your device'}})())}).</p>
      <label class="chk" style="margin-top:10px"><input type="checkbox" data-act="emailrem" data-fk="emrem" ${!CL.prefs||CL.prefs.email_reminders!==false?'checked':''}> <span>Also email me these reminders</span></label>
      <p class="muted small" style="margin-top:6px">Emails only go out once the person who runs this site has set up an email sender. Until then, reminders arrive as alerts.</p>`}</section>
    ${appearancePanels()}
    <section class="panel"><h3>Data backup</h3>
      <p class="muted">Export saves a copy of this workspace’s members, groups, tasks and activity history as a file. A shared workspace cannot be restored from a file, because the server keeps the real record.</p>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="export" data-fk="exp">Export workspace</button></div></section>
    ${collabPanel()}
    ${cyDanger()}`;
}

/* =====================================================================
   10. Start
   ===================================================================== */
(function start(){
  try{const sraw=localStorage.getItem(SKEY);if(sraw){const s=JSON.parse(sraw);if(s&&typeof s==='object')ST={...ST,...s}}}catch{}
  CL.cfg=cloudCfg();
  let mode='';try{mode=localStorage.getItem(MODEKEY)||''}catch{}
  captureInvite();
  /* An invite link only makes sense in shared mode, so opening one switches to it when connection details exist. */
  if(CL.pending&&CL.cfg)mode='cloud';
  /* With connection details built into the file, new visitors start in shared mode. They can still choose local demo mode on the sign-in screen. */
  if(CL.cfg&&CL.cfg.builtIn&&!mode)mode='cloud';
  CL.on=!!(CL.cfg&&mode==='cloud');
  applyTheme();setupCursor();
  if(CL.on){cloudBoot();return}
  loadAll();render();
  if(CL.pending&&!CL.cfg)toast('This link is an invitation, but shared mode is not set up in this file yet.',true);
})();
})();
</script>
</body>
</html>
